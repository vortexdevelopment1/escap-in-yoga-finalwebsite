services:
  - type: web
    name: escap-in-yoga-backend
    runtime: node
    rootDir: yoga-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: er.prachirohit@gmail.com
      - key: SMTP_PASS
        value: lzlantxdmfkmtqzd
      - key: SMTP_FROM
        value: Escape in Yoga <er.prachirohit@gmail.com>
